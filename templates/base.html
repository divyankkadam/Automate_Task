{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automate the task</title>

    <!-- bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="{% static 'js/custom.js' %}"></script>

    <!-- ckeditor -->
    <script type="text/javascript" src="{% static 'ckeditor/ckeditor-init.js' %}"></script>
    <script type="text/javascript" src="{% static 'ckeditor/ckeditor/ckeditor.js' %}"></script>

    <style>
    .home-info{
        position:absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 20px;
    }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-secondary ">
        <div class="container">
            <a class="navbar-brand mb-0 h1" href="{% url 'home' %}">AUTOMATE TASK</a>
            {% if user.is_authenticated %}
            <!--  Show logout  button -->
            <div>
                <b>{{user | upper }}</b>
                &nbsp<a href="{% url 'logout' %}" class="float-right btn btn-danger">Logout</a>
            </div>
            
            {% else %}
            <div>
                <a href="{% url 'login' %}" class="float-right text-docoration-none btn btn-warning ">Login</a>
                &nbsp;<a href="{% url 'register' %}" class="float-right btn btn-success">Register</a>
            </div>
            {% endif %}
        </div>
    </nav>


    {% block content %}

    {% endblock %}

    <!-- Footer -->    

</body>
</html>
