{% extends 'base.html'%}
{% block content %}
    <div class="container mt-5 alert-success shadow" style="max-width: 600px; padding : 50px ; border-radius: 10px;">
        <h3 class="text-center">Export data from Database Tables</h3>

        <form action="{% url 'export_data'  %}" method="POST"  enctype="multipart/form-data"  style="max-width:600px; margin:auto; padding-top: 50px;">
            {% csrf_token %}

            <div class="from-group" style="padding-top:20px;padding-bottom: 10px;">
                <label for="model_name">Select Databse Table</label>
                <select name="model_name"  class="form-control"  required>
                    <option value="" disabled selected>Select</option>
                    {% for model in custom_models %}
                    <option value="{{model}}" > {{ model }}</option>
                    {% endfor %}
                </select>
            </div>

            <input  type="submit" value="Export Data" class="btn btn-warning"> 

            {% include 'alerts.html' %}

        </form>
    </div>
{% endblock %}
